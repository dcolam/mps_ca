[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mpsca"
version = "0.1.0"
description = "Calcium-imaging processing for Min6 recordings: lazy TIFF import, Zarr experiment stores, segmentation, traces and analysis"
readme = "README.md"
requires-python = ">=3.11"  # zarr 3 needs 3.11+
dependencies = [
    "numpy",
    "scipy",
    "scikit-image",
    "scikit-learn",
    "pandas",
    "openpyxl",
    "tifffile",
    "imagecodecs",
    "zarr>=3",
    "dask[array]",
    "matplotlib",
]

[project.optional-dependencies]
gui = ["napari[pyqt5]", "magicgui"]
cellpose = ["cellpose"]
dev = ["pytest"]

[project.scripts]
mpsca = "mpsca.cli:main"

[project.entry-points."napari.manifest"]
mpsca = "mpsca.gui:napari.yaml"

[tool.hatch.build.targets.wheel]
packages = ["src/mpsca"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
markers = ["slow: needs model weights or a display"]
